{"bank_detail":"An elevated ranking indicates stronger public-data risk indicators relative to peers. It does not mean that the institution will fail.","configuration_hash":"e0a0191ad707ba07586be1c87123ef56265b886c7f72dded22b62cd33dc31486","driver_heading":"Factors associated with the institution's model ranking","persistent":"This platform ranks institutions relative to other eligible banks in the same reporting quarter using public FDIC data. Scores are not calibrated failure probabilities, official CAMELS ratings, regulatory determinations, or investment recommendations.","ranking_interpretation":"An elevated ranking indicates stronger public-data risk indicators relative to other eligible institutions in the same reporting quarter. It does not mean that the institution will fail.","version":"phase6-disclaimers-v1"}