name: Bug report
description: Report a reproducible defect using publication-safe artifacts.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not attach source data, bank-level prediction exports, secrets, or model binaries.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps using the synthetic public package.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python and operating-system versions; omit personal paths.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, personal paths, raw data, and real institution-level outputs.
          required: true
