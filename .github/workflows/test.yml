name: Public tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/public_release
      - run: python scripts/validate_environment.py
      - run: python -m ruff check scripts/run_demo.py scripts/validate_environment.py src/public_release tests/public_release
